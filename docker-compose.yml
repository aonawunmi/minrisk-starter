version: '3.8'

services:
  # MinRisk Frontend Application
  minrisk-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ANTHROPIC_API_KEY: ${VITE_ANTHROPIC_API_KEY}
    container_name: minrisk-web
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_ANTHROPIC_API_KEY=${VITE_ANTHROPIC_API_KEY}
    restart: unless-stopped
    networks:
      - minrisk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

